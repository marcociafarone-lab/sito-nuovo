<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  
  html, body {
    background: #000;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  
  #video-wrap {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: #000;
    pointer-events: none;
  }
  
  #video-wrap iframe {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 100vw;
    height: 56.25vw;
    transform: translate(-50%, -50%);
    border: none;
    display: block;
  }

  @media (max-width: 700px) and (orientation: portrait) {
    #video-wrap iframe {
      width: 100vw !important;
      height: 56.25vw !important;
    }
  }
  
  #audio-gate {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: opacity 1.5s ease;
    -webkit-tap-highlight-color: transparent !important;
  }
  
  #audio-gate-text {
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.4);
    text-align: center;
    line-height: 1.6;
    padding: 0 20px;
    user-select: none;
  }

  #superfici {
    position: fixed;
    top: 24px; 
    left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    font-family: 'Courier New', monospace;
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0);
    line-height: 1.5;
    text-align: center;
    pointer-events: all;
    transition: color 1.2s;
    width: 90%;
    max-width: 600px;
  }

  #superfici a {
    display: inline-block;
    color: inherit;
    text-decoration: none;
    margin: 4px 10px;
    -webkit-tap-highlight-color: transparent !important;
  }
  #superfici a:hover { color: rgba(255,255,255,0.7) !important; }
  #superfici.visible { color: rgba(255,255,255,0.35); }

  @media (max-width: 480px) {
    #superfici { top: 15px; }
    #superfici a { margin: 3px 6px; }
  }
</style>
</head>
<body>

<div id="audio-gate">
  <div id="audio-gate-text">[ cinematic audio — headphones recommended ]</div>
</div>

</div>

<div id="superfici">

  <a href="/che-altro">che altro</a>
  <a href="/surfaces">surfaces</a>
</div>

<script>
  var tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  var firstScriptTag = document.getElementsByTagName('script')[0];
  firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

  var player;
  var isPlayerReady = false;

  function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
      videoId: 'vjh_DcWayGQ', 
      playerVars: {
        'autoplay': 1,
        'mute': 1, 
        'controls': 0,
        'rel': 0,
        'showinfo': 0,
        'loop': 1,
        'modestbranding': 1,
        'iv_load_policy': 3,
        'cc_load_policy': 0,
        'autohide': 1,
        'playlist': 'vjh_DcWayGQ'
      },
      events: {
        'onReady': onPlayerReady
      }
    });
  }

  function onPlayerReady(event) {
    isPlayerReady = true;
  }

  const gate = document.getElementById('audio-gate');
  const superfici = document.getElementById('superfici');

  gate.addEventListener('click', () => {
    gate.style.opacity = '0';
    setTimeout(() => { 
      gate.style.display = 'none'; 
    }, 1500);

    if (isPlayerReady && player) {
      player.unMute();
      player.setVolume(100);
      player.seekTo(0);
      player.playVideo();
    }

    setTimeout(() => { 
      superfici.classList.add('visible'); 
    }, 3000);
  });
</script>
</body>
</html>
