<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* Sfondo nero coerente con l'identità notturna di CONROI */
  html, body {
    background: #000;
    font-family: 'Courier New', Courier, monospace;
    color: rgba(255,255,255,0.7);
  }

  .sequenza { width: 100%; }

  .foto {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8vh 5vw;
  }

  /* --- FOTO HERO DESKTOP (A tutto schermo) --- */
  .foto.hero {
    padding: 0;
    height: 100vh;
    min-height: unset;
  }

  .foto.hero img {
    object-fit: cover;
    image-rendering: -webkit-optimize-contrast;
  }

  .foto img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* --- RITMO ASIMMETRICO DESKTOP (Sulle 7 foto ripristinate) --- */
  .sequenza .foto:nth-child(2) img,
  .sequenza .foto:nth-child(3) img,
  .sequenza .foto:nth-child(4) img {
    max-width: 65%;
  }
  .sequenza .foto:nth-child(5) img { max-width: 85%; }
  .sequenza .foto:nth-child(6) img { max-width: 65%; } 
  .sequenza .foto:nth-child(7) img { max-width: 90%; }

  /* --- BLOCCO TESTI TECNICI --- */
  .info-tecniche {
    padding: 12vh 32px 0 32px; 
    max-width: 480px;
    margin: 0 auto;
  }

  .info-group {
    font-family: 'Courier New', monospace; 
    font-size: 9px; 
    letter-spacing: 0.2em; 
    line-height: 2.2; 
    color: rgba(255,255,255,0.5); 
    margin-bottom: 8vh;
  }

  .info-group.tracce {
    color: rgba(255,255,255,0.35);
  }

  /* --- MENU IN BASSO CRONOLOGICO --- */
  .fine {
    height: 40vh;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0 32px 32px;
    max-width: 560px;
    margin: 0 auto;
  }

  .fine span {
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.35);
    line-height: 2.2;
  }

  .fine a {
    display: block;
    color: inherit;
    text-decoration: none;
    margin-bottom: 4px;
  }

  .fine a.corrente {
    color: rgba(255,255,255,0.12);
    pointer-events: none;
  }

  .fine a:hover { color: rgba(255,255,255,0.8); }

  /* ==========================================================================
     ZONA CORREZIONE MOBILE INFALLIBILE (HERO ADATTIVA SENZA CORRUZIONE)
     ========================================================================== */
  @media (max-width: 480px) {
    .foto {
      height: auto !important;
      min-height: auto !important;
      padding: 30px 20px !important; /* Margine compatto tra le foto sul telefono */
    }

    .foto img,
    .sequenza .foto:nth-child(2) img,
    .sequenza .foto:nth-child(3) img,
    .sequenza .foto:nth-child(4) img,
    .sequenza .foto:nth-child(5) img,
    .sequenza .foto:nth-child(6) img,
    .sequenza .foto:nth-child(7) img { 
      width: 100% !important;
      max-width: 100% !important;
      height: auto !important;
      object-fit: contain !important;
    }

    /* LA HERO IMAGE SUL TELEFONO OCCUPA LO SCHERMO MA NON VIENE INGRANDITA O SGRANATA */
    .foto.hero {
      width: 100vw !important;
      height: 100vh !important;
      min-height: 100vh !important;
      max-height: 100vh !important;
      padding: 0 !important;
      overflow: hidden !important;
    }
    .foto.hero img {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important; /* Si adatta all'altezza dello schermo dello smartphone */
      padding: 0 10px;
    }

    .info-tecniche {
      padding: 8vh 24px 0 24px;
    }
  }
</style>
