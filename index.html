<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="CONROI — music, art, drawings. con-roi.com">
<title>CONROI</title>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "MusicGroup",
  "name": "CONROI",
  "url": "https://con-roi.com",
  "logo": {
    "@type": "ImageObject",
    "url": "https://con-roi.com/SIMBOLO.jpg",
    "description": "CONROI bitmap matrix encoded in HEX on the blockchain"
  },
  "sameAs": [
    "https://conroi.bandcamp.com/",
    "https://open.spotify.com/intl-it/artist/1R9LpWhWU94CiymCzesOsK",
    "https://opensea.io/collection/440-hz-bit-less"
  ]
}
</script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: #000 !important; }
  body {
    background: #000 !important;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    cursor: pointer;
    display: block;
  }
  .margine {
    position: fixed;
    font-family: 'Courier New', Courier, monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: rgba(255,255,255,0.18);
    pointer-events: none;
    user-select: none;
    line-height: 1.8;
  }
  .bl { bottom: 28px; left: 32px; }
  .br { bottom: 28px; right: 32px; text-align: right; }

  /* OTTIMIZZAZIONE RESPONSIVE PER SCHERMI STRETTI (MOBILE) */
  @media (max-width: 480px) {
    #hex-link {
      width: 85% !important; /* Impedisce al testo di toccare i bordi dello schermo */
      white-space: normal !important; /* Permette alla stringa HEX di andare a capo */
      word-break: break-all !important; /* Spezza la stringa HEX in modo pulito */
      text-align: center;
    }
    .info-fissa {
      font-size: 7px !important; /* Riduce leggermente le info tecniche per non affollare lo schermo */
      bottom: 15px !important;
      left: 15px !important;
    }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<!-- ID hex-link ottimizzato con stili integrati per il wrapping -->
<div style="
  position:fixed;
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Courier New', monospace;
  font-size: 8px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.18);
  white-space: nowrap;
  z-index: 1;
  pointer-events: none;
  user-select: none;
" id="hex-link">0xfbd8d4fcaffc8b126ae77b64d1b238b952659a6df47c7dfe4a5186241abb1770</div>

<!-- Aggiunta classe .info-fissa per controllarla via CSS su mobile -->
<div class="info-fissa" style="
  position:fixed;
  bottom: 28px;
  left: 32px;
  font-family: 'Courier New', monospace;
  font-size: 8px;
  letter-spacing: 0.12em;
  color: rgba(255,255,255,0.15);
  pointer-events: none;
  line-height: 1.9;
  z-index: 1;
">noise update · 27.5 Hz<br>oscillation · 0.44 Hz</div>

<script>
const data = `
000000000000000000000000000000000000000000
000000000000000000000000000000000000000000
001111111111111111111111111111111111111100
001111111111111111111111111111111111111100
001100000000000000000000000000000000000000
001100000000000000000000000000000000000000
001100111111111111111111111111111111111100
001100111111111111111111111111111111111100
001100110000000000000000000000000000001100
001100110000000000000000000000000000001100
001100110011111111111111111111111111001100
001100110011111111111111111111111111001100
001100110011000000000000000000000011001100
001100110011000000000000000000000011001100
001100110011001111111111111111110011001100
001100110011001111111111111111110011001100
001100110011001100000000000000000011001100
001100110011001100000000000000000011001100
001100110011001100111111111111110011001100
001100110011001100111111111111110011001100
001100110011001100110000000000110011001100
001100110011001100110000000000110011001100
001100110011001100110000110000110011001100
001100110011001100110000110000110011001100
001100110011001100110000110000110011001100
001100110011001100110000110000110011001100
001100110011001100110000110000110011001100
001100110011001100110000110000110011001100
001100110011001100110000000000110011001100
001100110011001100110000000000110011001100
001100110011001100111111111111110011001100
001100110011001100111111111111110011001100
001100110000000000000000000000000000001100
001100110000000000000000000000000000001100
001100111111111111111111111111111111111100
001100111111111111111111111111111111111100
001100000000000000000000000000000000000000
001100000000000000000000000000000000000000
001111111111111111111111111111111111111100
001111111111111111111111111111111111111100
000000000000000000000000000000000000000000
000000000000000000000000000000000000000000`.trim().split('\n');

const rows = data.length;
const cols = data[0].length;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function getScale() {
  const s = Math.min(
    Math.floor((window.innerWidth * 0.8) / cols),
    Math.floor((window.innerHeight * 0.8) / rows)
  );
  return Math.max(4, s);
}

let SCALE = getScale();

function setSize() {
  SCALE = getScale();
  canvas.width = cols * SCALE;
  canvas.height = rows * SCALE;
}

setSize();
window.addEventListener('resize', setSize);

const noiseCanvas = document.createElement('canvas');
noiseCanvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;';
document.body.appendChild(noiseCanvas);
const noiseCtx = noiseCanvas.getContext('2d');

function generateNoise() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  noiseCanvas.width = W;
  noiseCanvas.height = H;

  const imageData = noiseCtx.createImageData(W, H);
  const d = imageData.data;
  const cx = W / 2, cy = H / 2;
  const maxDist = Math.sqrt(cx * cx + cy * cy);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const i = (y * W + x) * 4;
      const dist = Math.sqrt((x - cx) * (x - cx) + (y - cy) * (y - cy));
      const falloff = Math.max(0, 1 - (dist / maxDist) * 1.4);
      d[i]   = Math.random() * 255;
      d[i+1] = Math.random() * 255;
      d[i+2] = Math.random() * 255;
      d[i+3] = Math.random() * 60 * falloff;
    }
  }
  noiseCtx.putImageData(imageData, 0, 0);
}

generateNoise();
window.addEventListener('resize', generateNoise);

const FREQ_440 = (2 * Math.PI * 0.44) / 60;
const NOISE_INTERVAL = Math.round(60 / 27.5);

let t = 0;
let noiseFrame = 0;

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const alpha = 0.75 + 0.25 * Math.sin(t);
  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#ffffff';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (data[r][c] === '1') {
        ctx.fillRect(c * SCALE, r * SCALE, SCALE, SCALE);
      }
    }
  }
  ctx.globalAlpha = 1;

  noiseFrame++;
  if (noiseFrame % NOISE_INTERVAL === 0) generateNoise();

  t += FREQ_440;
  requestAnimationFrame(draw);
}

draw();

const hexLink = document.getElementById('hex-link');

function posizionaHex() {
  const rect = canvas.getBoundingClientRect();
  
  // CORREZIONE POSIZIONAMENTO MOBILE AUTO-ADATTIVO
  if (window.innerWidth <= 480) {
    // Su mobile, se lo spazio sotto il canvas è pochissimo, lo agganciamo in modo fisso o lo teniamo a distanza minima
    const sottomine = Math.min(rect.bottom + 14, window.innerHeight - 80);
    hexLink.style.top = sottomine + 'px';
  } else {
    // Su desktop rimane invariato come volevi tu
    hexLink.style.top = (rect.bottom + 14) + 'px';
  }
}

posizionaHex();
window.addEventListener('resize', posizionaHex);

canvas.addEventListener('click', () => {
  window.location.href = '/bitless';
});
</script>
</body>
</html>
